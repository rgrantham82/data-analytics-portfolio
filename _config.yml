# ==========================
# Site Settings
# ==========================

title: "Robert Grantham - Data Analyst"
description: "Showcasing data analytics projects and skills."
url: "https://rgrantham82.github.io"
baseurl: "/data-analytics-portfolio"

remote_theme: pages-themes/architect@v0.2.0

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Used by jekyll-seo-tag for social previews
logo: /assets/images/logo.png

twitter:
  card: summary_large_image
  # username: ""   # optional

# ==========================
# Author Information
# ==========================

author:
  name: "Robert Grantham"
  email: "robertgrantham40@gmail.com"
  linkedin: "https://www.linkedin.com/in/robertgrantham82/"
  github: "https://github.com/rgrantham82"

# ==========================
# Build Settings
# ==========================

markdown: kramdown
kramdown:
  input: GFM

# Clean URLs for pages (recommended for a portfolio site)
permalink: pretty

# ==========================
# Navigation Links (Optional)
# ==========================
# Only keep this if you loop over it in your layout.
navigation:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/about/"
  - title: "Projects"
    url: "/projects/"
  - title: "Contact"
    url: "/contact/"

# ==========================
# Exclude Files and Directories
# ==========================

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .gitignore
  # Generated locally by the Python companion scripts; not part of the site
  - "projects/**/analysis_outputs/"
  - "**/.ipynb_checkpoints/"

# ==========================
# Google Analytics
# ==========================

google_analytics: "G-7WZFJ98W4K"

# ==========================
# Social Links
# ==========================

social:
  kaggle: "https://kaggle.com/wotan587"
  # twitter: "https://twitter.com/yourtwitterhandle"
  # facebook: "https://facebook.com/yourfacebookpage"
  # instagram: "https://instagram.com/yourinstagramhandle"

# ==========================
# Other Settings
# ==========================
