<!-- _includes/head-custom.html -->

<!-- Favicon and Apple Touch Icon -->
<link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600&display=swap" rel="stylesheet">

<!-- Optional: Social preview image override (only if you want a consistent image everywhere) -->
<meta property="og:image" content="{{ '/assets/images/logo.png' | absolute_url }}">
<meta name="twitter:image" content="{{ '/assets/images/logo.png' | absolute_url }}">
